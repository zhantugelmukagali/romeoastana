name: Domain checks
on:
  push:
    branches: [main, bonuspro/rebuild]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Python runtime
        run: python3 -c "import sys; assert sys.version_info >= (3, 12)"
      - name: Run financial invariant tests
        env:
          PYTHONPATH: backend
        run: python3 -m unittest discover -s tests/unit -v
