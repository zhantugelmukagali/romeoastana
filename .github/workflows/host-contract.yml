name: Public host protocol inspection
on:
  push:
    branches: [bonuspro/rebuild]
    paths: [scripts/inspect_host_transport.py, .github/workflows/host-contract.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect public provider JavaScript without account access
        run: python3 scripts/inspect_host_transport.py
