<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>БонусПро · Сверка заказов</title><link rel="stylesheet" href="/assets/app.css">
<script type="module" src="/assets/reconciliation.js"></script><script type="module" src="/assets/shell.js"></script></head>
<body><main>
<header><div><span class="brand">БонусПро</span><h1>Сверка заказов</h1></div><a href="/settings">Настройки</a><a href="/returns">История возвратов</a></header>
<p id="status" role="status" aria-live="polite">Подключаемся к МойСклад…</p>
<button id="retry" hidden>Повторить подключение</button>
<section id="workspace" hidden>
<p class="hint">Обычные возвраты пересчитываются автоматически. Здесь — операции, для которых не хватает свободных бонусов, и расхождения в документах.</p>
<button id="refresh">Обновить</button>
<nav aria-label="Статус сверки"><button data-state="pending" aria-pressed="true">Требуют решения</button>
<button data-state="applied" aria-pressed="false">Пересчитаны</button><button data-state="waived" aria-pressed="false">Бонусы сохранены</button>
<button data-state="superseded" aria-pressed="false">Документы изменились</button></nav>
<div id="cases"></div><button id="more" hidden>Показать ещё</button>
<section aria-label="Неподтверждённые списания"><h2>Неподтверждённые списания</h2><div id="unverified"></div></section>
<section aria-label="Расхождения в документах"><h2>Расхождения в документах</h2><div id="issues"></div></section>
</section>
<dialog id="decision" aria-labelledby="title"><form id="decision-form">
<h2 id="title"></h2><p id="impact"></p>
<label for="reason">Причина решения</label><textarea id="reason" maxlength="500" rows="3" required></textarea>
<p id="error" class="error" role="alert"></p>
<div class="actions"><button id="cancel" type="button">Отмена</button><button id="confirm" class="primary" type="submit">Подтвердить</button></div>
</form></dialog>
</main></body></html>
