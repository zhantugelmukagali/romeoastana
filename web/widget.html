<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>БонусПро — бонусы заказа</title><link rel="stylesheet" href="/assets/widget.css">
<script type="module" src="/assets/widget.js"></script></head>
<body><main aria-labelledby="title"><header><div class="widget-heading"><h1 id="title">БонусПро</h1><span id="order-label" class="order-label"></span></div><button id="refresh" type="button">Обновить</button></header>
<p id="status" role="status" aria-live="polite">Откройте виджет в заказе МойСклад.</p>
<section id="summary" hidden><dl><div><dt>Баланс</dt><dd id="balance">—</dd><small id="available-note">Бонусы покупателя</small></div><div><dt>Можно списать</dt><dd id="maximum">—</dd><small>С учётом баланса и лимита</small></div></dl>
<p id="basis" class="muted"></p><form id="spend-form"><label for="points">Списать бонусы</label>
<div class="controls"><input id="points" name="points" type="number" min="1" step="1" inputmode="numeric" autocomplete="off" placeholder="0" aria-describedby="amount-hint payable" required>
<button id="maximum-button" type="button">Максимум</button><button id="apply" type="submit">Применить к заказу</button></div>
<p id="amount-hint" class="muted"></p><p id="payable" class="payable"></p></form></section>
<section id="pending" hidden><div class="pending-mark" aria-hidden="true"></div><h2 id="pending-title">Осталось сохранить заказ</h2><p id="pending-text"></p><p id="pending-note" class="muted"></p><button id="verify" type="button">Проверить сохранение</button></section>
<p class="muted footnote">1 бонус = 1 ₸. Доставка не участвует. Списание подтверждается после сохранения заказа.</p>
</main></body></html>
