<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>БонусПро — бонусы заказа</title><link rel="stylesheet" href="/assets/widget.css">
<script type="module" src="/assets/widget.js"></script></head>
<body><main aria-labelledby="title">
<header><div class="widget-heading"><h1 id="title">Бонусы</h1><span id="order-label" class="sr-only"></span></div>
<button id="refresh" type="button" aria-label="Обновить" title="Обновить бонусы">
<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3A7 7 0 0 0 17.9 17"/></svg>
</button></header>
<p id="status" role="status" aria-live="polite">Откройте заказ в МойСклад.</p>
<section id="summary" hidden>
<dl id="balances"><div><dt>Баланс</dt><dd id="balance">—</dd><small id="available-note" hidden></small></div>
<div id="limit-block"><dt>Можно списать</dt><dd id="maximum">—</dd></div></dl>
<form id="spend-form" hidden><label for="points">Списать бонусы</label>
<div class="controls"><div class="amount-field"><input id="points" name="points" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Сумма" aria-describedby="amount-hint" required><span aria-hidden="true">₸</span></div>
<button id="maximum-button" type="button">Максимум</button></div>
<p id="amount-hint" role="status" hidden></p></form>
<div id="payable-row" class="total"><span>К оплате</span><output id="payable" for="points" aria-live="polite"></output></div>
<button id="apply" type="submit" form="spend-form" hidden>Применить</button>
<div id="earning" class="earning" hidden><div><span>После оплаты и отгрузки</span><strong id="earn-value"></strong></div></div>
<details id="conditions"><summary>Условия</summary><div class="conditions-body"><p>1 бонус = 1 ₸. Доставка и услуги не участвуют.</p><p id="basis"></p></div></details>
</section>
<section id="pending" hidden aria-live="polite"><span class="pending-mark" aria-hidden="true"></span><h2 id="pending-title"></h2><p id="pending-text"></p><p id="pending-note"></p><button id="verify" type="button">Проверить сохранение</button></section>
</main></body></html>
